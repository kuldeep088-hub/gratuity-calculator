<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="gGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <linearGradient id="eqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0070f3"/>
      <stop offset="100%" stop-color="#00dfd8"/>
    </linearGradient>
  </defs>

  <!-- Dark Premium Container Tile -->
  <rect width="128" height="128" rx="30" fill="#111113"/>
  <rect x="1" y="1" width="126" height="126" rx="29" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- The "G" Curve -->
  <!-- Arc from (90, 42) around to (90, 86), then into bottom corner, then horizontal stem to (62, 68) -->
  <path d="M 88 42 A 40 40 0 1 0 88 86 L 88 64 H 62 V 74 H 78 L 78 80 A 30 30 0 1 1 78 48 Z" fill="url(#gGrad)"/>

  <!-- Top Rupee Bar 1 -->
  <rect x="36" y="32" width="46" height="7" rx="3.5" fill="#ffffff"/>

  <!-- Middle Rupee Bar 2 -->
  <rect x="36" y="45" width="46" height="7" rx="3.5" fill="#ffffff"/>

  <!-- Calculator Equals Accent at the G entrance -->
  <rect x="86" y="64" width="18" height="4" rx="2" fill="url(#eqGrad)"/>
  <rect x="86" y="72" width="18" height="4" rx="2" fill="url(#eqGrad)"/>
</svg>