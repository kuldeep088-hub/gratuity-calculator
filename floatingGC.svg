<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Vibrant FinTech Gradient -->
    <linearGradient id="gcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00dfd8"/>
      <stop offset="60%" stop-color="#0070f3"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
  </defs>

  <!-- Deep Graphite / Carbon Squircle Tile -->
  <rect width="128" height="128" rx="28" fill="#111113"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- Outer "G" (Gratuity) - Pure Crisp White -->
  <path
    d="M 98 34 A 46 46 0 1 0 98 94 L 98 58 H 64 V 70 H 86 L 86 82 A 34 34 0 1 1 86 46 Z"
    fill="#ffffff"
  />

  <!-- Inner "C" (Calculator) - Floating with 8px Breathing Gap -->
  <!-- Center (64, 64), Outer R=26, Inner R=16 -->
  <!-- Opening from angle ~40deg to -40deg -->
  <!-- Top tip: x=64+26*cos(-40)=84, y=64-26*sin(40)=47 -->
  <path
    d="M 75 47 A 16 16 0 1 0 75 81 L 82 88 A 26 26 0 1 1 82 40 Z"
    fill="url(#gcGradient)"
  />
</svg>