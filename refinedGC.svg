<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Premium Vercel / FinTech Cyan-to-Blue Electric Gradient -->
    <linearGradient id="gcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00dfd8"/>
      <stop offset="50%" stop-color="#0070f3"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
  </defs>

  <!-- Dark Slate / Carbon Base Tile -->
  <rect width="128" height="128" rx="28" fill="#111113"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- Outer "G" (Gratuity) - Crisp White -->
  <!-- Arc from 40deg above horizontal to 40deg below, with clean inward horizontal bar -->
  <path
    d="M 98 34 A 46 46 0 1 0 98 94 L 98 58 H 64 V 70 H 86 L 86 82 A 34 34 0 1 1 86 46 Z"
    fill="#ffffff"
  />

  <!-- Inner "C" (Calculator) - Electric Cyan/Blue Gradient -->
  <!-- Nested concentric arc -->
  <path
    d="M 78 46 A 24 24 0 1 0 78 82 L 85 89 A 34 34 0 1 1 85 39 Z"
    fill="url(#gcGrad)"
  />
</svg>